name: Project verification
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      DISTRESS_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: scripts/run.sh -m pytest -q
      - run: scripts/run.sh scripts/verify_project.py
      - run: scripts/run.sh scripts/execute_notebooks.py --check-only
