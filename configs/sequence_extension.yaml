registration: optional_sequence_extension_before_sequence_training
window_calendar_years: 3
family: gru
hidden_size: 32
layers: 1
dropout: 0.15
max_epochs: 25
patience: 4
batch_size: 1024
learning_rate: 0.001
weight_decay: 0.0001
seed: 42
feature_set: LAGS
mask: explicit_observed_flag_per_calendar_year
normalization: one_shared_snapshot_preprocessor_fit_on_current_training_role
controls: [snapshot_S0_xgboost, snapshot_S0_mlp, flattened_LAGS_xgboost, flattened_LAGS_mlp]
selection: development_macro_year_AP_only
historical_status: previously_inspected_evaluation_after_freeze
sampling: none
