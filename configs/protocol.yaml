implementation:
  directory: individual_extension/performance_v2
  selection: three-year screen; five-year promotion; three-seed shortlist; guardrailed
    near-tie choice
  screen_minimum_completed_years_before_prune: 2
  screen_pruning: After two years only, AP mean < 0.65 * fixed incumbent matching-year
    AP; also retain family exploration first six complete configurations.
  refit: New full-window model; same optimizer update count as inner best checkpoint
    by default; epoch-equivalent and keep-best sensitivity explicitly labeled.
  inner_stopping: Last fit year, sklearn AP for NN; CatBoost PRAUC and XGBoost aucpr
    explicitly library-specific; selected candidates always externally scored with
    sklearn AP.
  sampling: Equal original-data optimizer-step budgets; separate epoch-equivalent
    ROS control; no sampled validation rows.
  scheduler: Cosine uses optimizer-step horizon fixed by inner maximum; same horizon/warmup
    retained in refit.
  weighting: Class alpha0/0.5/1; company beta0/.5/1, time half-life none/3/5 introduced
    separately after strong baselines.
  legacy_archive: Fixed archived13 list confined to archive-role reconstruction after
    confirmation opened; P2 INNER_L1 selects in every fit role.
  confirmation: Freeze candidate/blend choices before reading 2014 labels once; no
    search restart after confirmation.
  history: Freeze all final artifacts then batch read 2015-2018 labels once; preserve
    source exposure disclosure.
  no_historical_target_stop: true
