[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-distress-ml"
version = "1.0.0"
description = "Independent retrospective failed-company classification benchmark"
requires-python = ">=3.11"
authors = [{name = "Qidian (Martin) Xing"}]
dependencies = ["numpy", "pandas", "scikit-learn", "torch", "xgboost", "imbalanced-learn", "PyYAML", "joblib", "matplotlib"]

[project.scripts]
distress-ml = "distress_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
